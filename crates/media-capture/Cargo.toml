[package]
name = "osdm-media-capture"
version = "0.1.4-alpha.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
quick-xml = "0.42"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"
