name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v0.1.1-alpha.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      prerelease: ${{ steps.verify.outputs.prerelease }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify tag and version files
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          package_version=$(jq -r .version package.json)
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          engine_version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/download-engine/Cargo.toml | head -1)
          for crate in cli browser-bridge; do
            tool_version=$(sed -n 's/^version = "\(.*\)"/\1/p' "crates/$crate/Cargo.toml" | head -1)
            if [[ "$tool_version" != "$version" ]]; then
              echo "Version mismatch in crates/$crate/Cargo.toml" >&2
              exit 1
            fi
          done
          if [[ "$package_version" != "$version" || "$cargo_version" != "$version" || "$engine_version" != "$version" ]]; then
            echo "Version mismatch: tauri.conf.json=$version package.json=$package_version src-tauri/Cargo.toml=$cargo_version crates/download-engine/Cargo.toml=$engine_version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match the application version v$version." >&2
            exit 1
          fi
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing OSDM $RELEASE_TAG from $GITHUB_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run engine tests
        run: cargo test --locked -p download-engine -p osdm-cli -p osdm-browser-bridge

  windows:
    name: Build Windows installer
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis

      - name: Build capture and automation tools
        shell: pwsh
        run: |
          cargo build --locked --release -p osdm-cli -p osdm-browser-bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:extension
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path capture-tools | Out-Null
          Copy-Item target/release/osdm-cli.exe,target/release/osdm-native-host.exe capture-tools/
          Copy-Item -Recurse extension capture-tools/extension
          Copy-Item crates/cli/README.md capture-tools/CLI.md
          Compress-Archive -Path capture-tools/* -DestinationPath "osdm-capture-tools_${env:RELEASE_TAG}_x64.zip"

      - name: Upload Windows capture tools
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture-tools
          path: osdm-capture-tools_*.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux package
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Debian package
        run: pnpm tauri build --bundles deb

      - name: Build capture and automation tools
        run: |
          cargo build --locked --release -p osdm-cli -p osdm-browser-bridge
          mkdir capture-tools
          cp target/release/osdm-cli target/release/osdm-native-host capture-tools/
          cp -r extension capture-tools/extension
          cp crates/cli/README.md capture-tools/CLI.md
          tar -czf "osdm-capture-tools_${RELEASE_TAG}_amd64.tar.gz" -C capture-tools .

      - name: Upload Linux capture tools
        uses: actions/upload-artifact@v4
        with:
          name: linux-capture-tools
          path: osdm-capture-tools_*.tar.gz
          if-no-files-found: error

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: [preflight, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            cat > ../RELEASE_NOTES.md <<EOF
          **OSDM $RELEASE_TAG** for Windows 10/11 and Linux.

          Built automatically from $RELEASE_TAG.

          ### Downloads

          - Windows: NSIS installer
          - Linux: Debian package for Ubuntu 24.04 and newer
          - Capture tools: separate CLI/native-host archives with extension source and setup scripts (manual registration; extensions are not store-signed)

          SHA256SUMS.txt covers every downloadable asset.

          OSDM is alpha software. Keep backups of important files and review the documentation before upgrading.

          Database upgrades may prevent reopening application data with older binaries.
          Capture/automation is a preview: synchronization publishes separate revisions, not in-place replacements; the full P2 gate remains open.

          **Changes and known limitations:** https://github.com/${{ github.repository }}/blob/$RELEASE_TAG/CHANGELOG.md
          **Capture validation:** https://github.com/${{ github.repository }}/blob/$RELEASE_TAG/docs/p2-validation.md

          **Full documentation:** https://github.com/${{ github.repository }}#readme
          EOF
            args=(--title "OSDM $RELEASE_TAG" --notes-file ../RELEASE_NOTES.md)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" * "${args[@]}" --repo "$GITHUB_REPOSITORY"
          fi
